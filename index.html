<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera RCP Pro - Next Gen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="sidebar" class="sidebar">
        <h3>⚙️ Pengaturan</h3>
        <div class="menu">
            <h4>Tampilan</h4>
            <select onchange="changeFont(this.value)">
                <option value="Inter">Inter (Modern)</option>
                <option value="monospace">Monospace</option>
                <option value="cursive">Cursive</option>
            </select>
            <input type="range" min="12" max="30" oninput="changeFontSize(this.value)">
        </div>
        <div class="menu">
            <h4>Watermark</h4>
            <input type="text" placeholder="Nama Kustom..." oninput="setWatermark(this.value)">
        </div>
        <div class="menu">
            <h4>Fitur</h4>
            <button class="btn-side" onclick="toggleLocation()">GPS: ON/OFF</button>
            <button class="btn-side" onclick="toggleSidebar()">Tutup</button>
        </div>
    </div>

    <button class="open-sidebar" onclick="toggleSidebar()">⚙️</button>

    <div class="app-container">
        <header>
            <h2>RCP<span>PRO</span></h2>
            <p id="time"></p>
        </header>

        <div class="camera-wrapper">
            <div class="camera-box" id="camBox">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <div class="shutter-flash"></div>
                <div class="grid-overlay"></div>
            </div>

            <div class="info-overlay">
                <p id="address">Mendeteksi lokasi...</p>
            </div>
        </div>

        <div class="main-controls">
            <div class="filter-bar">
                <button onclick="setFilter('normal')">Normal</button>
                <button onclick="setFilter('vintage')">Vintage</button>
                <button onclick="setFilter('cool')">Cool</button>
                <button onclick="setFilter('bw')">B&W</button>
            </div>

            <div class="action-bar">
                <button class="btn-icon" onclick="switchCamera()">🔄</button>
                <button class="btn-shutter" onclick="takePhoto()">
                    <div class="inner-shutter"></div>
                </button>
                <button class="btn-icon" onclick="toggleNight()">🌙</button>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <button id="openCam" onclick="startCamera()">📷 AKTIFKAN KAMERA</button>

    <script src="script.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js");
        }
    </script>
</body>
</html>
