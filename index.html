<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera RCP Pro</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<h2>📸 Camera RCP Pro</h2>

<button id="openCam" onclick="startCamera()">
📷 Buka Kamera
</button>

<div class="camera-box">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>

<div class="controls">
<button onclick="takePhoto()">📸 Foto</button>
<button onclick="switchCamera()">🔄 Switch</button>
<button onclick="toggleNight()">🌙 Night</button>

<button onclick="setFilter('normal')">Normal</button>
<button onclick="setFilter('vintage')">Vintage</button>
<button onclick="setFilter('cool')">Cool</button>
<button onclick="setFilter('bw')">B&W</button>
</div>

<p id="time"></p>
<p id="address">Detecting location...</p>

<div id="map"></div>

<script src="script.js"></script>

</body>
</html>
