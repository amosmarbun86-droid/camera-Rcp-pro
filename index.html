<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Camera RCP Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="logo.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<!-- ⚙️ SIDEBAR BUTTON -->
<button class="open-sidebar" onclick="toggleSidebar()">⚙️</button>

<!-- ⚙️ SIDEBAR -->
<div id="sidebar" class="sidebar">
<h3>⚙️ Pengaturan</h3>

<div class="menu">
<h4>Tampilan</h4>
<select onchange="changeFont(this.value)">
<option>Arial</option>
<option>monospace</option>
<option>cursive</option>
</select>

<input type="range" min="12" max="30"
oninput="changeFontSize(this.value)">
</div>

<div class="menu">
<h4>Watermark</h4>
<input type="text" placeholder="Nama..."
oninput="setWatermark(this.value)">

<select onchange="setWatermarkPosition(this.value)">
<option value="bottom">Bawah</option>
<option value="top">Atas</option>
</select>
</div>

<div class="menu">
<h4>Lokasi</h4>
<button onclick="toggleLocation()">ON / OFF</button>
</div>
</div>

<h2>📸 Camera RCP Pro</h2>

<button id="openCam" onclick="startCamera()">📷 Buka Kamera</button>

<div class="camera-box">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>

<div class="controls">
<button onclick="takePhoto()">📸 Foto</button>
<button onclick="switchCamera()">🔄 Switch</button>
<button onclick="toggleNight()">🌙 Night</button>

<button onclick="setFilter('normal')">Normal</button>
<button onclick="setFilter('vintage')">Vintage</button>
<button onclick="setFilter('cool')">Cool</button>
<button onclick="setFilter('bw')">B&W</button>
</div>

<p id="time"></p>
<p id="address">Detecting location...</p>

<div id="map"></div>

<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
