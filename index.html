<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera RCP Pro - Final Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="sidebar" class="sidebar">
        <h3>⚙️ Pengaturan Pro</h3>
        <div class="menu">
            <h4>Fitur Utama</h4>
            <button class="btn-side" onclick="toggleGrid()">Grid Komposisi: ON/OFF</button>
            <button class="btn-side" onclick="toggleLocation()">GPS Lokasi: ON/OFF</button>
        </div>
        <div class="menu">
            <h4>Tampilan Watermark</h4>
            <select onchange="changeFont(this.value)">
                <option value="Inter">Font: Modern Inter</option>
                <option value="monospace">Font: Monospace</option>
                <option value="cursive">Font: Cursive</option>
            </select>
            <input type="range" min="12" max="30" value="18" oninput="changeFontSize(this.value)">
        </div>
        <div class="menu">
            <h4>Teks Tambahan</h4>
            <input type="text" placeholder="Nama Kustom..." oninput="setWatermark(this.value)">
        </div>
        <button class="btn-side" style="background:rgba(239, 68, 68, 0.2); margin-top:20px;" onclick="toggleSidebar()">TUTUP</button>
    </div>

    <button class="open-sidebar" onclick="toggleSidebar()">⚙️</button>

    <div class="app-container">
        <header>
            <h2>RCP<span>PRO</span></h2>
            <p id="voiceStatus">🎙️ Perintah Suara Aktif: "Amos Foto"</p>
            <p id="time"></p>
        </header>

        <div class="camera-wrapper">
            <div class="camera-box" id="camBox">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" style="display:none;"></canvas>
                
                <div id="gridOverlay" class="grid-layer" style="display:none;">
                    <div class="v-line" style="left: 33.33%;"></div>
                    <div class="v-line" style="left: 66.66%;"></div>
                    <div class="h-line" style="top: 33.33%;"></div>
                    <div class="h-line" style="top: 66.66%;"></div>
                </div>

                <div class="shutter-flash"></div>
            </div>

            <div class="info-overlay">
                <p id="address">Mendeteksi lokasi GPS...</p>
            </div>
        </div>

        <div class="main-controls">
            <div class="filter-bar">
                <button onclick="setFilter('normal')">Normal</button>
                <button onclick="setFilter('vintage')">Vintage</button>
                <button onclick="setFilter('cool')">Cool</button>
                <button onclick="setFilter('bw')">B&W</button>
            </div>

            <div class="action-bar">
                <button class="btn-icon" onclick="switchCamera()">🔄</button>
                <button class="btn-shutter" onclick="takePhoto()">
                    <div class="inner-shutter"></div>
                </button>
                <button class="btn-icon" onclick="toggleNight()">🌙</button>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <button id="openCam" onclick="startCamera()">📷 AKTIFKAN KAMERA</button>

    <script src="script.js"></script>
</body>
</html>
