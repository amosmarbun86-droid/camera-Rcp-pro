<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Camera RCP Pro</title>

<!-- MOBILE VIEW -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- PWA CONFIG -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="logo.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- STYLE -->
<link rel="stylesheet" href="style.css">

<!-- LEAFLET MAP -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<h2>📸 Camera RCP Pro</h2>

<button id="openCam" onclick="startCamera()">
📷 Buka Kamera
</button>

<div class="camera-box">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>

<div class="controls">
<button onclick="takePhoto()">📸 Foto</button>
<button onclick="switchCamera()">🔄 Switch</button>
<button onclick="toggleNight()">🌙 Night</button>

<button onclick="setFilter('normal')">Normal</button>
<button onclick="setFilter('vintage')">Vintage</button>
<button onclick="setFilter('cool')">Cool</button>
<button onclick="setFilter('bw')">B&W</button>
</div>

<p id="time"></p>
<p id="address">Detecting location...</p>

<div id="map"></div>

<script src="script.js"></script>

<!-- ✅ SERVICE WORKER REGISTER -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("✅ Camera RCP Pro PWA Active"))
      .catch(err => console.log("SW Error:", err));
  });
}
</script>

<!-- ✅ AUTO INSTALL APP -->
<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  setTimeout(() => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
      });
    }
  }, 2500);
});
</script>

</body>
</html>
