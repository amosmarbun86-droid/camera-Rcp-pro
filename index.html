<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Camera RCP Pro</title>

<link rel="stylesheet" href="style.css">

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<div class="app">

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- GRID -->
  <div class="grid"></div>

  <!-- TOP -->
  <div class="top-bar">
    <button onclick="toggleNight()">🌙</button>
    <button onclick="switchCamera()">🔄</button>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- INFO -->
  <div class="info">
    <p id="time"></p>
    <p id="address"></p>
    <p id="coords"></p>
  </div>

  <!-- FILTER -->
  <div class="filters">
    <button onclick="setFilter('normal')">Normal</button>
    <button onclick="setFilter('vintage')">Vintage</button>
    <button onclick="setFilter('cool')">Cool</button>
    <button onclick="setFilter('bw')">B/W</button>
  </div>

  <!-- ZOOM -->
  <input type="range" id="zoom" min="1" max="3" step="0.1" value="1">

  <!-- BOTTOM -->
  <div class="bottom-bar">
    <button onclick="switchCamera()">🔄</button>
    <button class="capture" onclick="takePhoto()">📸</button>
    <button onclick="toggleRecord()" id="rec">⏺️</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
